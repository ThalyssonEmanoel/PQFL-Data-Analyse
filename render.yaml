# Blueprint do Render para o PQFL (monorepo: back-end + front-end).
# Use em: Render → New + → Blueprint (aponte para este repositório).
# Os valores marcados com "sync: false" são preenchidos no painel (segredos).
# Detalhes e passo a passo: front-end/DEPLOY.md

services:
  # ---------------- API (Node + Express) ----------------
  - type: web
    name: pqfl-api
    runtime: node
    rootDir: back-end
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JWT_ISSUER
        value: pqfl-api
      - key: JWT_AUDIENCE
        value: pqfl-clients
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_WEB
        value: 7d
      - key: FRONT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAIL_PROVIDER
        value: console
      # Coletum (sincronização) — preencha no painel:
      - key: COLETUM_BASE_URL
        sync: false
      - key: COLETUM_FORM_ID
        sync: false
      - key: COLETUM_TOKEN
        sync: false

  # ---------------- Front-end (Vue + Vite, estático) ----------------
  - type: web
    name: pqfl-front
    runtime: static
    rootDir: front-end
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Reescrita para SPA: qualquer rota cai no index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
